name: Native desktop
on:
  workflow_dispatch:
  push:
    branches: ['main']
    tags: ['desktop-v*']
    paths: ['desktop/**', '.github/workflows/desktop.yml']
  pull_request:
    paths: ['desktop/**', '.github/workflows/desktop.yml']
permissions:
  contents: read
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            platform: linux-x64
          - os: windows-latest
            platform: windows-x64
          - os: macos-latest
            platform: macos-arm64
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.2'
      - name: Verify release version
        if: startsWith(github.ref, 'refs/tags/desktop-v')
        run: bun -e "if (process.env.GITHUB_REF_NAME !== 'desktop-v' + (await Bun.file('package.json').json()).version) throw new Error('Tag and package version differ')"
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libegl1 libxkbcommon0 libwayland-client0 wl-clipboard grim slurp xclip imagemagick libayatana-appindicator3-1 libsecret-1-0 gnome-keyring dbus-x11 gcc g++ clang libfontconfig-dev libwayland-dev libxkbcommon-x11-dev libx11-xcb-dev libssl-dev libzstd-dev libvulkan1
      - run: bun install --frozen-lockfile
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: '1.97.1'
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/.gpuix/packages/native
      - if: runner.os == 'macOS'
        run: xcodebuild -downloadComponent MetalToolchain
      - run: bun run prepare:renderer
      - run: bun run typecheck
      - if: runner.os != 'Linux'
        run: bun scripts/verify-vault.ts
      - if: runner.os == 'Linux'
        run: dbus-run-session -- sh -c 'printf test | gnome-keyring-daemon --unlock --components=secrets; bun scripts/verify-vault.ts'
      - if: runner.os != 'Linux'
        run: bun scripts/verify-accessibility.tsx
      - run: bun test src/services
      - if: failure() && runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: windows-snapshot-diagnostic
          path: desktop/test-results/
          if-no-files-found: ignore
      - run: bun run build
      - if: runner.os != 'Windows'
        run: tar -czf riot-2fa-${{ matrix.platform }}.tar.gz -C dist .
      - if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path dist/* -DestinationPath riot-2fa-${{ matrix.platform }}.zip
      - uses: actions/upload-artifact@v4
        with:
          name: riot-2fa-${{ matrix.platform }}
          path: |
            desktop/riot-2fa-*.tar.gz
            desktop/riot-2fa-*.zip
          if-no-files-found: error
          compression-level: 0
  release:
    if: startsWith(github.ref, 'refs/tags/desktop-v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: riot-2fa-*
          path: release-assets
          merge-multiple: true
      - name: Generate checksums
        working-directory: release-assets
        run: sha256sum riot-2fa-* > SHA256SUMS.txt
      - name: Publish desktop preview
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" release-assets/* --verify-tag --title "Riot 2FA Desktop ${GITHUB_REF_NAME#desktop-v} preview" --notes-file desktop/RELEASE_NOTES.md --prerelease
